[tool.ruff]
target-version = "py311"
line-length = 100

# 起步基线：只查"会出错"的规则（语法/未定义名/未使用导入），
# 风格类规则等重构完成后再逐步打开。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
